name: Test installer

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [bash, zsh, pwsh]
    steps:
      - uses: actions/checkout@v4
      - if: matrix.shell != 'pwsh'
        run: sudo apt-get update && sudo apt-get install -y fortune-mod zsh
      - if: matrix.shell != 'pwsh'
        env:
          TEST_SHELL: ${{ matrix.shell }}
        run: |
          export HOME="$(mktemp -d)"
          export SHELL="/bin/$TEST_SHELL"
          bash install.sh
          bash install.sh
          shell_rc="$HOME/.${TEST_SHELL}rc"
          first="$("/bin/$TEST_SHELL" -ic "source \"$shell_rc\"")"
          second="$("/bin/$TEST_SHELL" -ic "source \"$shell_rc\"")"
          test -n "$first"
          test -n "$second"
          bash install.sh --uninstall
      - if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          $env:HOME = Join-Path $env:RUNNER_TEMP "quote-me-$([guid]::NewGuid())"
          New-Item -ItemType Directory $env:HOME | Out-Null
          ./install.ps1
          ./install.ps1
          $first = pwsh -Command '$null'
          $second = pwsh -Command '$null'
          if ([string]::IsNullOrWhiteSpace($first) -or [string]::IsNullOrWhiteSpace($second)) { throw 'Quote check failed' }
          ./install.ps1 -Uninstall
